<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner LinkedIn Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
.app{min-height:100vh;background:#F4F5F5;color:#000;font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app button,.app input,.app select,.app textarea{font-family:inherit}
.topbar{background:#fff;border-bottom:1px solid #D9DEDE}
.topbar-in{max-width:1240px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-0.1px;white-space:nowrap}
.brand-sub{font-size:13px;color:#5F6464;white-space:nowrap}
.brand-note{font-size:13px;color:#5F6464}
.stepper-wrap{background:#fff;border-bottom:1px solid #D9DEDE}
.stepper{max-width:1240px;margin:0 auto;padding:20px 32px;display:flex;align-items:center;gap:12px}
.step{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 6px 4px 0;border-radius:8px;cursor:pointer;color:#5F6464;text-align:left}
.step:disabled{cursor:default}
.step .dot{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#fff;border:1.5px solid #7B8282;color:#333;transition:background .15s,border-color .15s,color .15s}
.step.done .dot{background:#86BC25;border-color:#86BC25;color:#000}
.step.active .dot{background:#000;border-color:#000;color:#fff;box-shadow:0 0 0 3px #86BC25}
.step .slabel{font-size:14px;font-weight:600;color:#5F6464;line-height:1.2}
.step .ssub{display:block;font-size:12px;font-weight:400;color:#5F6464}
.step.active .slabel,.step.done .slabel{color:#000}
.step.done:hover .dot{background:#76A71F;border-color:#76A71F}
.sline{flex:1 1 24px;height:2px;border-radius:2px;background:#D9DEDE;min-width:16px}
.sline.done{background:#86BC25}
.page{max-width:1240px;margin:0 auto;padding:48px 32px 64px}
.eyebrow{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#4A7510}
.h1{margin:0;font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-0.6px;outline:none}
.lead{margin:12px 0 0;font-size:18px;line-height:1.5;color:#333;max-width:640px}
.ogrid{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ocard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:#fff;border:1px solid #D9DEDE;border-radius:12px;padding:20px;min-height:208px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .15s,box-shadow .15s,transform .15s;color:#000}
.ocard:hover{border-color:#333;box-shadow:0 6px 20px rgba(0,0,0,.09);transform:translateY(-1px)}
.ocard.sel{border-color:#86BC25;box-shadow:0 0 0 2px #86BC25,0 6px 20px rgba(0,0,0,.08)}
.otop{display:flex;width:100%;align-items:center;justify-content:space-between;margin-bottom:8px}
.oicon{width:44px;height:44px;border-radius:10px;background:#F4F5F5;display:flex;align-items:center;justify-content:center;color:#000;transition:background .15s}
.ocard.sel .oicon{background:#000;color:#86BC25}
.onum{font-size:13px;font-weight:600;color:#5F6464;font-variant-numeric:tabular-nums}
.ocheck{width:24px;height:24px;border-radius:50%;background:#86BC25;display:flex;align-items:center;justify-content:center}
.otitle{font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-0.1px}
.odesc{font-size:14px;line-height:1.5;color:#333}
.actions{margin-top:40px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.actions-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.helper{font-size:14px;color:#5F6464}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:8px;border:1px solid transparent;font-size:15px;font-weight:600;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn-primary{background:#86BC25;color:#000}
.btn-primary:hover{background:#76A71F}
.btn-primary:active{background:#689519}
.btn-primary:disabled{background:#D9DEDE;color:#555B5B;cursor:not-allowed}
.btn-secondary{background:#fff;color:#000;border-color:#000}
.btn-secondary:hover{background:#F4F5F5}
.btn-secondary:disabled{border-color:#D9DEDE;color:#6B7070;cursor:not-allowed;background:#fff}
.btn-quiet{background:transparent;color:#000;padding:0 12px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.btn-quiet:hover{background:#E9ECEC}
.btn-quiet:disabled{color:#6B7070;cursor:not-allowed;background:transparent}
.btn-lg{height:52px;padding:0 28px;font-size:16px}
.app button:focus-visible,.app input:focus-visible,.app select:focus-visible,.app textarea:focus-visible{outline:2px solid #000;outline-offset:2px;box-shadow:0 0 0 5px rgba(134,188,37,.55)}
.chiprow{margin-top:28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #D9DEDE;border-radius:999px;padding:6px 16px 6px 8px;font-size:14px;font-weight:600}
.chip .ci{width:28px;height:28px;border-radius:50%;background:#000;color:#86BC25;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #D9DEDE;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.formcard{margin-top:24px;max-width:860px;padding:32px}
.legend{margin:0 0 24px;font-size:13px;color:#5F6464}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field.f-wide{grid-column:span 2}
.flabel{font-size:14px;font-weight:600;color:#000}
.req{color:#B3261E}
.input{width:100%;height:48px;border:1px solid #7B8282;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;color:#000;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:#6B7070}
.input:hover{border-color:#333}
.input:focus{border-color:#000}
.input.bad{border-color:#B3261E;box-shadow:inset 0 0 0 1px #B3261E}
.ta{height:auto;min-height:340px;padding:16px;line-height:1.6;resize:vertical;font-size:16px}
.fhelp{font-size:13px;line-height:1.4;color:#5F6464;display:flex;align-items:flex-start;gap:6px;min-height:18px}
.fhelp.err{color:#B3261E;font-weight:600}
.summary{margin:0 0 24px;padding:14px 16px;border-radius:8px;background:#FCEDEC;border:1px solid #B3261E;color:#7A1812;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.cols{margin-top:40px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.gallery{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px;max-height:720px;overflow-y:auto;padding:4px 6px 4px 4px}
.tcard{background:#fff;border:1px solid #D9DEDE;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .15s,box-shadow .15s}
.tcard:hover{border-color:#333}
.tcard.sel{border-color:#86BC25;box-shadow:0 0 0 2px #86BC25,0 6px 20px rgba(0,0,0,.07)}
.tmain{display:block;width:100%;text-align:left;background:none;border:0;padding:18px 20px 8px;cursor:pointer;color:#000;border-radius:12px 12px 0 0}
.thead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tnum{flex:none;min-width:34px;height:26px;padding:0 8px;border-radius:6px;background:#F4F5F5;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tcard.sel .tnum{background:#000;color:#86BC25}
.tname{font-size:16px;font-weight:700;line-height:1.3}
.tstyle{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4A7510}
.texcerpt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.55;color:#333}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px 16px}
.tcount{font-size:13px;color:#5F6464;font-variant-numeric:tabular-nums}
.tfoot .btn{height:40px;padding:0 16px;font-size:14px}
.side{flex:1 1 420px;min-width:0;position:sticky;top:16px}
.sidecard{padding:28px;display:flex;flex-direction:column;gap:16px}
.sidelabel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5F6464}
.sidetitle{margin:0;font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-0.2px}
.sidebody{white-space:pre-wrap;word-break:break-word;background:#F4F5F5;border-radius:10px;padding:20px;font-size:15px;line-height:1.65;color:#000;max-height:420px;overflow-y:auto}
.sidemeta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.editor-grid{margin-top:40px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.editor{flex:1 1 520px;min-width:0;padding:28px;display:flex;flex-direction:column;gap:16px}
.preview{flex:1 1 440px;min-width:0}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#5F6464;font-variant-numeric:tabular-nums}
.counter.over{color:#B3261E;font-weight:600}
.banner{display:flex;align-items:flex-start;gap:12px;border-radius:8px;padding:14px 16px;font-size:14px;font-weight:600}
.banner.ok{background:#EEF6DC;border:1px solid #86BC25;color:#1F3A00}
.banner.fail{background:#FCEDEC;border:1px solid #B3261E;color:#7A1812}
.li{background:#fff;border:1px solid #D9DEDE;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
.li-head{display:flex;gap:12px;padding:16px 16px 8px}
.li-av{flex:none;width:52px;height:52px;border-radius:50%;background:#D9DEDE;color:#5F6464;display:flex;align-items:center;justify-content:center}
.li-name{font-size:15px;font-weight:700;line-height:1.3}
.li-title{font-size:13px;color:#5F6464;line-height:1.35}
.li-time{font-size:12px;color:#5F6464;display:flex;align-items:center;gap:4px;margin-top:2px}
.li-body{padding:4px 16px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.55;color:#000}
.li-link{margin:0 16px 12px;border:1px solid #D9DEDE;border-radius:8px;padding:10px 12px;background:#F4F5F5;font-size:13px;color:#333;display:flex;align-items:center;gap:8px;word-break:break-all}
.li-bar{display:flex;justify-content:space-around;border-top:1px solid #D9DEDE;padding:8px 8px;font-size:13px;font-weight:600;color:#5F6464}
.empty{color:#5F6464;font-style:italic}
.note{margin-top:12px;font-size:13px;color:#5F6464;line-height:1.5}
.foot{max-width:1240px;margin:0 auto;padding:0 32px 40px;font-size:13px;color:#5F6464}
@media (max-width:760px){
.topbar-in,.stepper,.page,.foot{padding-left:16px;padding-right:16px}
.brand-sub,.brand-note{display:none}
.step .stext{display:none}
.step.active .stext{display:block}
.h1{font-size:30px}
.lead{font-size:16px}
.page{padding-top:32px}
.fgrid{grid-template-columns:minmax(0,1fr)}
.field.f-wide{grid-column:auto}
.formcard,.editor,.sidecard{padding:20px}
.gallery{max-height:none;overflow:visible}
.side{position:static}
.actions{flex-direction:column-reverse;align-items:stretch}
.actions-r{flex-direction:column-reverse;align-items:stretch}
.btn{width:100%}
.tfoot .btn{width:auto}
}
@media (prefers-reduced-motion:reduce){
.app *{transition:none!important;transform:none!important}
}
