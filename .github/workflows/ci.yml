name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moves to 26.04 in November 2026. Move up once Playwright's --with-deps supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26   # tests need WebAssembly JSPI (asyncio.run in real Python)
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
